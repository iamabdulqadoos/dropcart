services:

  api:
    build: .
    container_name: dropcart-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: dropcart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dropcart
    ports:
      - "5433:5432"
    volumes:
      - dropcart_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dropcart-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: dropcart-celery
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  dropcart_postgres_data: